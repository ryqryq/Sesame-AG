
name: Sesame-AG Manual Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sesame-ag-manual-build
  cancel-in-progress: false

env:
  CI: "true"
  JAVA_DISTRIBUTION: "oracle"
  JAVA_VERSION: "17.0.1"
  ANDROID_API_LEVEL: "37"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  RELEASE_DIR: app/build/outputs/apk/release
  STAGING_DIR: app/build/outputs/apk/all

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Set Timezone to Asia/Shanghai
        shell: bash
        run: |
          set -euo pipefail
          sudo timedatectl set-timezone Asia/Shanghai
          echo "Current time: $(date)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          architecture: x64
          check-latest: false
          cache: gradle

      - name: Pin Gradle Java Home
        shell: bash
        run: |
          set -euo pipefail
          echo "ORG_GRADLE_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print Toolchain Versions
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "ORG_GRADLE_JAVA_HOME=${ORG_GRADLE_JAVA_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          java -version
          sdkmanager --version
          ./gradlew --version

      - name: Build Release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Stage Unsigned APKs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}"

          mapfile -t apks < <(
            find "${RELEASE_DIR}" -maxdepth 1 -type f -name "*.apk" | sort
          )

          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No release APKs found" >&2
            exit 1
          fi

          for apk in "${apks[@]}"; do
            cp "${apk}" "${STAGING_DIR}/"
          done

      - name: Sign APKs
        id: sign_apks
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: ${{ env.STAGING_DIR }}
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Verify Personal APK Signatures
        shell: bash
        env:
          SIGNED_FILES: ${{ steps.sign_apks.outputs.signedFiles }}
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          keystore="${RUNNER_TEMP}/personal-release.jks"
          trap 'rm -f "$keystore"' EXIT

          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > "$keystore"

          expected="$(
            keytool -exportcert \
              -keystore "$keystore" \
              -alias "$ANDROID_KEY_ALIAS" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" |
            openssl dgst -sha256 -binary |
            xxd -p -c 256 |
            tr '[:lower:]' '[:upper:]'
          )"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="${sdk_root}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          if [[ ! -x "$apksigner" ]]; then
            echo "Cannot find apksigner" >&2
            exit 1
          fi

          IFS=':' read -r -a files <<< "$SIGNED_FILES"
          verified=0

          for apk in "${files[@]}"; do
            [[ -f "$apk" ]] || {
              echo "Signed APK missing: $apk" >&2
              exit 1
            }

            result="$("$apksigner" verify --verbose --print-certs "$apk")"

            actual="$(
              printf '%s\n' "$result" |
              awk -F': ' '/certificate SHA-256 digest:/ {
                gsub(/:/, "", $NF)
                print toupper($NF)
              }'
            )"

            if [[ "$actual" != "$expected" ]]; then
              echo "Personal signature verification failed!" >&2
              echo "Expected: $expected" >&2
              echo "Actual: $actual" >&2
              exit 1
            fi

            echo "Verified: $(basename "$apk")"
            verified=$((verified + 1))
          done

          if [[ $verified -eq 0 ]]; then
            echo "No signed APKs found!" >&2
            exit 1
          fi

      - name: Prepare Encrypted ZIP
        shell: bash
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
          SIGNED_FILES: ${{ steps.sign_apks.outputs.signedFiles }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y 7zip

          mkdir -p "${RUNNER_TEMP}/release-assets"

          IFS=':' read -r -a files <<< "$SIGNED_FILES"

          for apk in "${files[@]}"; do
            [[ -f "$apk" ]] || continue
            cp "$apk" "${RUNNER_TEMP}/release-assets/"
          done

          cd "${RUNNER_TEMP}/release-assets"

          sha256sum -- *.apk > SHA256SUMS

          cat > README.txt <<'EOF'
          Sesame-AG Personal Build

          Package name: io.github.aoguai.sesameag
          Signature: Personal Keystore
          ZIP encryption: AES-256

          Future updates must use the same personal Keystore.
          EOF

          7zz a -tzip -mem=AES256 \
            "-p${ARTIFACT_PASSWORD}" \
            "${RUNNER_TEMP}/Sesame-AG-Personal-Build.zip" \
            .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sesame-AG-Personal-Build
          path: ${{ runner.temp }}/Sesame-AG-Personal-Build.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
