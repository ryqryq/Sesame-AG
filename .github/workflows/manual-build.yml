
name: Sesame-AG Manual Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  JAVA_DISTRIBUTION: "oracle"
  JAVA_VERSION: "17.0.1"
  ANDROID_API_LEVEL: "37"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  LOCAL_GRADLE_VERSION: "9.5.1"
  LOCAL_AGP_VERSION: "9.2.1"
  LOCAL_KOTLIN_VERSION: "2.2.10"
  RELEASE_DIR: app/build/outputs/apk/release
  STAGING_DIR: app/build/outputs/apk/all
  ASSET_DIR: app/build/outputs/apk/release-assets
  ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}

jobs:
  build:
    name: Build, Sign and Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: Set Timezone to Asia/Shanghai
        shell: bash
        run: |
          set -euo pipefail
          sudo timedatectl set-timezone Asia/Shanghai
          echo "Current time: $(date)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          architecture: x64
          check-latest: false
          cache: gradle

      - name: Pin Gradle Java Home
        shell: bash
        run: |
          set -euo pipefail
          echo "ORG_GRADLE_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print Toolchain Versions
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "ORG_GRADLE_JAVA_HOME=${ORG_GRADLE_JAVA_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          java -version
          sdkmanager --version
          ./gradlew --version

      - name: Build Release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Stage Unsigned APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${STAGING_DIR}" "${ASSET_DIR}"
          mkdir -p "${STAGING_DIR}"

          mapfile -t apks < <(
            find "${RELEASE_DIR}" -maxdepth 1 -type f -name "*.apk" | sort
          )

          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No release APKs found in ${RELEASE_DIR}" >&2
            exit 1
          fi

          for apk in "${apks[@]}"; do
            cp "${apk}" "${STAGING_DIR}/"
          done

      - name: Sign APKs
        id: sign_apks
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: ${{ env.STAGING_DIR }}
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Verify Personal APK Signatures
        shell: bash
        env:
          SIGNED_FILES: ${{ steps.sign_apks.outputs.signedFiles }}
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner_path="${android_sdk_root}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          if [[ ! -x "${apksigner_path}" ]]; then
            echo "Unable to locate apksigner" >&2
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/personal-signing.keystore"
          trap 'rm -f "${keystore_path}"' EXIT

          printf '%s' "${ANDROID_SIGNING_KEY}" | base64 --decode > "${keystore_path}"

          expected_fingerprint="$(
            keytool -list -v \
              -keystore "${keystore_path}" \
              -alias "${ANDROID_KEY_ALIAS}" \
              -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
              -keypass "${ANDROID_KEY_PASSWORD}" 2>/dev/null |
            awk -F': ' '/SHA256:/ {
              gsub(/:/, "", $2)
              print toupper($2)
              exit
            }'
          )"

          if [[ ! "${expected_fingerprint}" =~ ^[0-9A-F]{64}$ ]]; then
            echo "Failed to read personal certificate SHA-256 fingerprint" >&2
            exit 1
          fi

          IFS=':' read -r -a files <<< "${SIGNED_FILES}"
          verified=0

          for file in "${files[@]}"; do
            [[ -n "${file}" ]] || continue

            if [[ ! -f "${file}" ]]; then
              echo "Signed APK is missing: ${file}" >&2
              exit 1
            fi

            cert_output="$(
              "${apksigner_path}" verify --verbose --print-certs "${file}"
            )"

            mapfile -t fingerprints < <(
              printf '%s\n' "${cert_output}" |
              awk -F': ' '/certificate SHA-256 digest:/ {
                digest=$NF
                gsub(/:/, "", digest)
                print toupper(digest)
              }'
            )

            if [[ ${#fingerprints[@]} -ne 1 ||
                  "${fingerprints[0]}" != "${expected_fingerprint}" ]]; then
              echo "Unexpected signing certificate: ${file}" >&2
              echo "Personal certificate verification failed." >&2
              exit 1
            fi

            echo "Signature verified: $(basename "${file}")"
            verified=$((verified + 1))
          done

          if [[ ${verified} -eq 0 ]]; then
            echo "No signed APKs were provided by the signing action" >&2
            exit 1
          fi

          echo "All ${verified} APK signatures verified successfully."

      - name: Prepare Release Assets
        shell: bash
        env:
          SIGNED_FILES: ${{ steps.sign_apks.outputs.signedFiles }}
        run: |
          set -euo pipefail

          mkdir -p "${ASSET_DIR}"

          IFS=':' read -r -a files <<< "${SIGNED_FILES}"
          copied=0

          for file in "${files[@]}"; do
            [[ -n "${file}" ]] || continue

            cp "${file}" "${ASSET_DIR}/"
            copied=$((copied + 1))
          done

          if [[ ${copied} -eq 0 ]]; then
            echo "No signed APKs were produced" >&2
            exit 1
          fi

          (
            cd "${ASSET_DIR}"
            sha256sum -- *.apk > SHA256SUMS
          )

          cat > "${ASSET_DIR}/README.txt" <<'EOF'
          Sesame-AG Personal Build

          APK files in this package have been signed with a personal signing certificate.

          Package name: io.github.aoguai.sesameag

          Verify APK checksums with:
          sha256sum -c SHA256SUMS

          Note:
          This build uses a personal signing certificate, not the official project certificate.
          It cannot directly update an installation signed with the official certificate.
          EOF

      - name: Package APK Artifact
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ARTIFACT_PASSWORD}" ]]; then
            echo "ARTIFACT_PASSWORD is not configured" >&2
            exit 1
          fi

          if ! command -v zip >/dev/null 2>&1; then
            echo "The zip command is not available on this runner" >&2
            exit 1
          fi

          artifact_path="${RUNNER_TEMP}/Sesame-AG-${GITHUB_RUN_NUMBER}.zip"

          (
            cd "${ASSET_DIR}"
            zip -r -P "${ARTIFACT_PASSWORD}" "${artifact_path}" .
          )

          echo "Encrypted ZIP created successfully."
          echo "Artifact: ${artifact_path}"

          echo "ARTIFACT_PATH=${artifact_path}" >> "$GITHUB_ENV"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sesame-AG-Personal-${{ github.run_number }}
          archive: false
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 14
